<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        header{
            position: sticky;
            top: 0;
        }
        nav{
            background-color: rgb(0, 174, 255);
            height: 75px;
        }
        main{
            background-color:aquamarine;
         padding: 34px;

        }
        .container{
            background-color: aqua;
            margin: 12px 34px;
            padding: 55px 23px;
            text-align: center;

        }
        .box1{
            background-color: beige;
            height: 70vh;
            width: 45%;
            margin:0px 12px;
            display: inline-block;
        }
        .box2{
            background-color: rgb(231, 231, 157);
            height: 70vh;
            width: 45%;
            margin:0px 12px;
            display: inline-block;
        }
        .text-box{
           padding: 34px;
           border: 2px solid black;
           margin: 50px 34vw;
           font-size: 2em;
           border-radius: 13px;
        }
        .orange-box{
            background:orangered;
            height: 32px;
            width:32px;
            position: fixed;
            bottom: 12px;
            right:23px;
            border-radius: 60px;
            

        }
        footer{
            background-color: rgb(160, 232, 146);
            height: 100px;
        }

    </style>
</head>
<body>
    <header>
        <nav>

        </nav>
    </header>
    <main>
        <div class="container">
            <div class="box1"></div>
               <div class="box2"></div>
               <div class="text-box">
                <p>welcome welcome welcome</p>
               </div>
        </div>
        <div class="orange-box">

        </div>

        </div>

           
    </main>
    <footer>

    </footer>
       
    
</body>
</html>
