<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form page</title>
</head>

<body>
    <h1>this is a form page</h1>
    <form action="post">
        <div>
            <label for="username">username: </label>
            <input id="username" type="text" name="username" placeholder="enter your username">
        </div>
        <div>
            <label for="male">male: </label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="female">female: </label>
            <input type="radio" id="female" name="gender" value="famale">
            <label for="female">female: </label>
            <input type="radio" id="female" name="gender" value="famale">
        </div>
        <div>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes">
            <label for="subscribe">subscribe to newsletter: </label>
        </div>
        <div>
            <input type="checkbox" id="follow" name="follow" value="yes">
            <label for="folloe">following newsletter: </label>
        </div>
        <div>
            <textarea id="message" name="message" rows="10" cols="17"
                placeholder="enter your message">my name is teja</textarea><br>
            <label for="country">country</label>
        </div>
        <div>
            <select id="country" name="country">
                <option>select a country</option>
                <option value="switzerland">switzerland</option>
                <option value="germany">germany</option>
            </select>
        </div>
        <input type="submit" value="submit">




    </form>

</body>

</html>
