<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media queries</title>
     <style>
          :root{
            --color:rgb(255, 132, 0);
            --defop:0.4;
            --defpad:23px;
            --secolor:rgb(42, 165, 87);
        }
        *{
            margin: 0;
            padding:0;
        }
        .container{
            background-color: var(--color);
            opacity:var(--defop);
            padding:var(--defpad);
            border: 1px solid black;
        }
         body {
                background-color: rgb(255, 81, 0);
            }
        @media screen and (orientation: portrait) {
            body {
                border: 2px solid black;
            }
        }

        @media only screen and (max-width: 455px) {
            body {
                background-color: rgb(68, 255, 0);
                color:aqua
            }

            .boxes {
                flex-direction: column;
            }

        
      
       
    </style>
</head>
<body>
   <div class="container">
    Lorem ipsum dolor sit amet consectetur adipisicing elit. Repellat id dicta, hic at laudantium optio?
    </div>
    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
       
    
</body>
</html>
