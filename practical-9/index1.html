<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box shadow and text shadow</title>
    <style>
        *{
            margin:0 ;
            padding: 0;
        }
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px blue;
            margin-bottom: 20px;
        }
        .box2{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px rgb(0, 255, 174);
        }
        .text-shadow{
            text-shadow: 5px 15px 5px brown;
        }
    </style>
</head>
<body>
    <div class="box">
        im a box
    </div>
    <div class="box2">
        im a box2
    </div>
    <br>
    <p class="text-shadow">
        Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quas ratione libero magnam, esse nostrum, minus laborum est aliquid, facere in vel vero blanditiis ab. Necessitatibus quia eveniet soluta eos! Aut.
    </p>
    
</body>
</html>
